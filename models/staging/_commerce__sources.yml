version: 2

# CONCEPT: sources declare tables dbt did NOT create. Models reference them with
# {{ source('commerce', 'orders') }} so lineage starts at the raw table, and
# `dbt source freshness` can check how recently data landed.
sources:
  - name: commerce
    database: COMMERCE_AI
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_lines
      - name: order_events
      - name: support_cases
        description: Newline-delimited JSON support cases, one VARIANT per row.
      - name: case_labels
        description: Human-labeled ground truth, used only to measure AI accuracy.
